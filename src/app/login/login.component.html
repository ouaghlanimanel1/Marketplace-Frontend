<div class="login-page-wrapper">
  <div class="login-card">
    <div class="login-visual">
      <div class="visual-decor"><span></span><span></span><span></span></div>
      <div class="login-visual-overlay">
        <h1 class="brand-kicker">Bienvenue sur</h1>
        <h2 class="brand-title">Marketplace</h2>
        <p class="brand-subtitle">
          Gérez vos annonces, suivez vos commandes et trouvez rapidement ce dont vous avez besoin.
        </p>
      </div>
    </div>

    <div class="login-container">
      <form (ngSubmit)="onSubmit()" class="login-form">
        <div class="form-header">
          <h2 class="form-title">Heureux de vous revoir</h2>
          <p class="form-subtitle">Connectez-vous à votre compte</p>
        </div>

        <div class="input-group">
          <label for="usernameOrEmail">Email</label>
          <input
            type="email"
            id="usernameOrEmail"
            [(ngModel)]="usernameOrEmail"
            name="usernameOrEmail"
            required
            placeholder="votre.email@exemple.com"
            autocomplete="email"
          />
        </div>

        <div class="input-group">
          <label for="password">Mot de passe</label>
          <input
            type="password"
            id="password"
            [(ngModel)]="password"
            name="password"
            required
            placeholder="Minimum 6 caractères"
            autocomplete="current-password"
          />
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" />
            <span>Se souvenir de moi</span>
          </label>
          <a routerLink="/forgot-password" class="forgot-password-link">Mot de passe oublié ?</a>
        </div>

        <button type="submit" class="login-button">Se connecter</button>

        <div class="form-footer">
          <p class="signup-text">
            Pas encore de compte ?
            <a routerLink="/register" class="signup-link">Créer un compte</a>
          </p>
        </div>

        <div *ngIf="isLoginFailed" class="error-message">
          {{ errorMessage }}
        </div>
      </form>
    </div>
  </div>
</div>
