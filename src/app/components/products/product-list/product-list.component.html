<div class="product-list-container">

  <!-- Section Header -->
  <div class="section-header">
    <h2 class="section-title">
      <span class="title-icon">🛍️</span> Mes articles
    </h2>
    <span class="product-count-badge" *ngIf="products?.length">
      {{ products.length }} article{{ products.length > 1 ? 's' : '' }}
    </span>
  </div>

  <!-- Product Grid -->
  <div class="product-grid">

    <!-- Empty State -->
    <div class="empty-state" *ngIf="!products || products.length === 0">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/>
      </svg>
      <h3>Aucun article publié</h3>
      <p>Ajoutez votre premier produit pour commencer à vendre.</p>
    </div>

    <!-- Product Cards -->
    <div *ngFor="let product of products" class="product-card" (click)="goToDetails(product.id!)">

      <!-- Image -->
      <div class="card-image-wrapper">
        <img
          *ngIf="product.imageUrl"
          [src]="'http://localhost:8083' + product.imageUrl"
          alt="{{ product.name }}"
          class="product-image"
        />
        <div *ngIf="!product.imageUrl" class="no-image-placeholder">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>
          </svg>
          <span>Pas d'image</span>
        </div>
      </div>

      <!-- Card Body -->
      <div class="card-body">
        <h3 class="product-name">{{ product.name }}</h3>
        <p class="product-description">{{ product.description }}</p>
        <div class="card-footer-row">
          <span class="product-price">{{ product.price | number:'1.2-2' }} <small>DT</small></span>
        </div>
      </div>

      <!-- Action Buttons (seller/admin only) -->
      <div
        class="product-actions"
        *ngIf="authService.isSeller() || authService.isAdmin()"
        (click)="$event.stopPropagation()"
      >
        <button class="btn edit-btn" (click)="onEdit(product)">
          ✏️ Modifier
        </button>
        <button class="btn delete-btn" (click)="onDelete(product.id)">
          🗑️ Supprimer
        </button>
      </div>
    </div>

  </div>
</div>
