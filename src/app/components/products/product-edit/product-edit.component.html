<div class="edit-product-page-wrapper" *ngIf="!loading; else loadingTpl">
  <div class="edit-product-container">
    <h2 class="form-title">Modifier le produit</h2>
    <p class="form-subtitle">
      Mettez à jour les informations de votre annonce.
    </p>

    <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
      <div class="form-group" [class.has-error]="productForm.controls['name'].invalid && productForm.controls['name'].touched">
        <label>Nom du produit</label>
        <input formControlName="name" type="text" placeholder="Ex: Montre connectée" />
        <div *ngIf="productForm.controls['name'].invalid && productForm.controls['name'].touched" class="error">
          Le nom est obligatoire.
        </div>
      </div>

      <div class="form-group">
        <label>Description détaillée</label>
        <textarea
          formControlName="description"
          rows="4"
          placeholder="Décrivez votre produit : caractéristiques, état, etc."
        ></textarea>
      </div>

      <div class="form-group" [class.has-error]="productForm.controls['price'].invalid && productForm.controls['price'].touched">
        <label>Prix (DT)</label>
        <input formControlName="price" type="number" min="0" step="0.01" />
        <div *ngIf="productForm.controls['price'].invalid && productForm.controls['price'].touched" class="error">
          Le prix doit être supérieur ou égal à 0.
        </div>
      </div>

      <div class="form-group">
        <label>Image du produit</label>

        <div class="current-image" *ngIf="productForm.get('imageUrl')?.value">
          <p class="input-hint">Image actuelle :</p>
          <img
            [src]="'http://localhost:8083' + productForm.get('imageUrl')?.value"
            alt="Image actuelle du produit"
          />
        </div>

        <input type="file" accept="image/*" (change)="onFileSelected($event)" />
        <p class="input-hint">
          Laissez vide pour conserver l'image actuelle. Formats acceptés : JPG, PNG. Taille max : 5MB.
        </p>
      </div>

      <button type="submit" class="submit-button" [disabled]="productForm.invalid">
        Enregistrer
      </button>

      <div *ngIf="errorMessage" class="error global-error">{{ errorMessage }}</div>
    </form>
  </div>
</div>

<ng-template #loadingTpl>
  <div class="edit-product-loading">
    <p>Chargement du produit...</p>
  </div>
</ng-template>
